[package]
name = "settled-desktop"
version = "0.1.0"
description = "Settled desktop cockpit for cross-device environment management"
authors = ["Settled"]
edition = "2024"

[lib]
name = "settled_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notify = "8"
notify-debouncer-mini = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
settled-core = { path = "../crates/settled-core" }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["full"] }
which = "8"

[dev-dependencies]
tempfile = "3"
