<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Settled</title>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("settled.theme") || "system";
          var isDark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var resolved = isDark ? "dark" : "light";
          document.documentElement.dataset.resolvedTheme = resolved;
          document.documentElement.style.colorScheme = resolved;
        } catch (_) {}
      })();
    </script>
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
      }
      html[data-resolved-theme="dark"],
      html[data-resolved-theme="dark"] body,
      html[data-resolved-theme="dark"] #root {
        background-color: #18191b;
        color-scheme: dark;
      }
      html[data-resolved-theme="light"],
      html[data-resolved-theme="light"] body,
      html[data-resolved-theme="light"] #root {
        background-color: #f3f5f2;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-resolved-theme]),
        html:not([data-resolved-theme]) body {
          background-color: #18191b;
          color-scheme: dark;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
