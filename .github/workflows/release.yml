name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64 (NSIS)
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            artifact: settled-windows-x64
          - label: macOS Apple Silicon + Intel (DMG)
            os: macos-15
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: settled-macos
          - label: Linux x64 (deb/rpm/AppImage)
            os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
            artifact: settled-linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri v2 and bundler dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libssl-dev \
            patchelf \
            rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.artifact }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build bundled desktop + CLI installer (Windows)
        if: runner.os == 'Windows'
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.targets }}
        run: npx tauri build --target ${{ matrix.targets }}

      - name: Build bundled desktop + CLI installers (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            echo "=== Building macOS bundle for $t ==="
            TAURI_ENV_TARGET_TRIPLE="$t" npx tauri build --target "$t"
          done

      - name: Build bundled desktop + CLI installer (Linux)
        if: runner.os == 'Linux'
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.targets }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx tauri build --target ${{ matrix.targets }}

      - name: Collect release installers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $files = Get-ChildItem -Path "target/${{ matrix.targets }}/release/bundle/nsis" -Filter "*.exe" -File
          if (-not $files) { throw "No NSIS installer produced" }
          Copy-Item $files.FullName -Destination release-assets/
          Get-ChildItem release-assets

      - name: Collect release installers (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          files=(
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          )
          if [ ${#files[@]} -lt 2 ]; then
            echo "Expected both arm64 and x64 DMG installers, found: ${files[*]}" >&2
            exit 1
          fi
          cp "${files[@]}" release-assets/
          ls -la release-assets

      - name: Collect release installers (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          files=(
            target/${{ matrix.targets }}/release/bundle/deb/*.deb
            target/${{ matrix.targets }}/release/bundle/rpm/*.rpm
            target/${{ matrix.targets }}/release/bundle/appimage/*.AppImage
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Linux installers produced" >&2
            exit 1
          fi
          cp "${files[@]}" release-assets/
          ls -la release-assets

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
