[package]
name = "settled-core"
version = "0.1.0"
edition = "2024"
description = "Core workspace loader, parallel command runner, and AI context builder for Settled"

[dependencies]
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
which = "8"

[dev-dependencies]
tempfile = "3"
