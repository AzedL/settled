[package]
name = "settled-cli"
version = "0.1.0"
edition = "2024"
description = "Headless CLI for Settled cross-device environment workspaces"

[[bin]]
name = "settled"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
settled-core = { path = "../settled-core" }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
